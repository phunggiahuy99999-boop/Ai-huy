<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>HUY.AI</title>
<meta name="theme-color" content="#12160f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HUY.AI">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="manifest" id="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Black+Ops+One&family=JetBrains+Mono:wght@400;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12160f;--bg2:#181d14;--panel:rgba(24,30,19,.88);--panel-solid:#1b2116;--line:rgba(196,178,132,.22);
  --txt:#ece5cc;--dim:#aaa486;--faint:#7a7660;
  --khaki:#c4b284;--olive:#5b6436;--drab:#3d4528;--coyote:#8a6a3f;--amber:#f2b33d;--hud:#b6e05a;--ok:#9fe070;--err:#ff6b4a;
  --cyan:var(--amber);--violet:var(--olive);--pink:var(--coyote);
  --glow:0 0 0 1px rgba(242,179,61,.35),0 0 18px rgba(242,179,61,.18);
  --head:"Oswald","Be Vietnam Pro",Impact,sans-serif;--mono:"JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--txt);font:15.5px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;background:var(--bg)}
body{display:flex;flex-direction:column;height:100dvh;background:transparent}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 40%,rgba(10,13,8,.48),rgba(8,10,6,.8)),
  repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;left:0;right:0;height:120px;top:-120px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(182,224,90,.05),transparent);animation:scan 7s linear infinite}
@keyframes scan{to{transform:translateY(calc(100vh + 120px))}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}

/* header */
header{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 10px 8px;
  border-bottom:2px solid var(--olive);background:linear-gradient(180deg,rgba(20,25,15,.96),rgba(20,25,15,.86));box-shadow:0 2px 0 rgba(0,0,0,.4)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:4px;
  background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,#1a1a12 10px 20px);opacity:.75}
.hbtn{width:42px;height:42px;border-radius:4px;display:grid;place-items:center;color:var(--khaki);border:1px solid transparent}
.hbtn:active{border-color:var(--amber);color:var(--amber)}
.brand{flex:1;text-align:center;font-family:"Black Ops One",var(--head);font-size:24px;letter-spacing:.12em;line-height:1.1;color:var(--khaki);
  text-shadow:0 2px 0 rgba(0,0,0,.6)}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--hud);text-transform:uppercase;
  max-width:64vw;margin:3px auto 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:0;background:var(--faint);margin-right:6px;vertical-align:0}
.dot.on{background:var(--hud);box-shadow:0 0 8px var(--hud);animation:blink 1.6s steps(2) infinite}
.dot.off{background:var(--err);box-shadow:0 0 8px var(--err)}
@keyframes blink{50%{opacity:.3}}

/* chat */
main{position:relative;z-index:1;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px 12px 8px}
.wrap{max-width:760px;margin:0 auto}
.msg{display:flex;gap:10px;margin:0 0 20px;animation:drop .3s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(8px)}}
.msg.user{justify-content:flex-end}
.bubble{max-width:86%;padding:11px 14px;border-radius:3px;word-wrap:break-word;overflow-wrap:anywhere;position:relative}
.user .bubble{background:linear-gradient(135deg,#6a7240,#4f5730);color:#f4efd9;border:1px solid #7b844c;white-space:pre-wrap;
  box-shadow:3px 3px 0 rgba(0,0,0,.45);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.user .bubble img{display:block;max-width:220px;max-height:220px;border-radius:2px;margin-bottom:6px;filter:saturate(.85)}
.bot .av{flex:none;width:32px;height:32px;border-radius:3px;display:grid;place-items:center;font-size:16px;margin-top:2px;color:#1b1f12;
  background:var(--khaki);border:2px solid #8f7f55;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.bot .bubble{background:var(--panel);border:1px solid var(--line);max-width:calc(100% - 42px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),3px 3px 0 rgba(0,0,0,.35)}
.bot .bubble::before,.bot .bubble::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--amber);pointer-events:none}
.bot .bubble::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.bot .bubble::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.bot .bubble.err{border-color:rgba(255,107,74,.6);color:#ffc4b5}
.bot .bubble.err::before,.bot .bubble.err::after{border-color:var(--err)}
.bubble p{margin:0 0 .6em}.bubble p:last-child{margin:0}
.bubble h1,.bubble h2,.bubble h3{font-family:var(--head);text-transform:uppercase;letter-spacing:.05em;font-size:1.08em;margin:.8em 0 .35em;color:var(--amber)}
.bubble ul,.bubble ol{margin:.3em 0 .7em;padding-left:1.3em}.bubble li{margin:.2em 0}
.bubble ul li::marker{content:"▸ ";color:var(--hud)}
.bubble ol li::marker{color:var(--hud);font-family:var(--mono)}
.bubble a{color:var(--hud)}
.bubble strong{color:#fff8e0}
.bubble code{font-family:var(--mono);font-size:.85em;background:rgba(0,0,0,.45);border:1px solid var(--line);padding:1px 5px;border-radius:2px;color:var(--hud)}
.bubble blockquote{margin:.5em 0;padding:.2em 0 .2em 10px;border-left:3px solid var(--amber);color:var(--dim)}
.bubble table{border-collapse:collapse;margin:.5em 0;font-size:.92em;display:block;overflow-x:auto}
.bubble th,.bubble td{border:1px solid var(--line);padding:5px 8px}.bubble th{background:rgba(91,100,54,.4);font-family:var(--head);text-transform:uppercase;letter-spacing:.04em}
.pre{position:relative;margin:.6em 0;border-radius:2px;border:1px solid var(--line);background:#0a0d07;overflow:hidden}
.pre .lang{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font:11px var(--mono);text-transform:uppercase;color:var(--hud);background:rgba(91,100,54,.25);border-bottom:1px solid var(--line)}
.pre pre{margin:0;padding:10px 12px;overflow-x:auto;font:13px/1.5 var(--mono);color:#d7f0a8}
.pre pre code{background:none;border:0;padding:0;color:inherit}
.mini{font:12px var(--mono);color:var(--dim);padding:2px 6px;border-radius:2px;text-transform:uppercase}.mini:active{color:var(--amber)}
.acts{display:flex;gap:4px;margin-top:6px;align-items:center}
.acts button{white-space:nowrap;flex:none;padding:4px 7px;border-radius:2px;font:11.5px var(--mono);text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:4px}
.acts button:active{background:rgba(242,179,61,.12);color:var(--amber)}
.acts .ico{width:14px;height:14px}
.typing{font:12px var(--mono);color:var(--hud)}
.typing span{display:inline-block;width:8px;height:8px;margin:0 3px;background:var(--hud);animation:b 1s steps(2) infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes b{50%{opacity:.15}}
.caret::after{content:"█";color:var(--hud);animation:blink 1s steps(2) infinite;margin-left:2px;font-size:.85em}

/* welcome */
.welcome{text-align:center;padding:6vh 8px 20px}
.orb{width:120px;height:120px;margin:0 auto 20px;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle,rgba(182,224,90,.12),rgba(10,14,8,.9) 70%),
  repeating-radial-gradient(circle,transparent 0 18px,rgba(182,224,90,.25) 18px 19px);
  border:2px solid rgba(182,224,90,.55);box-shadow:0 0 24px rgba(182,224,90,.2),inset 0 0 20px rgba(0,0,0,.6)}
.orb::before{content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,transparent 49.5%,rgba(182,224,90,.35) 49.5% 50.5%,transparent 50.5%),
  linear-gradient(90deg,transparent 49.5%,rgba(182,224,90,.35) 49.5% 50.5%,transparent 50.5%)}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(182,224,90,.55),rgba(182,224,90,0) 70deg,transparent);animation:sweep 3s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.orb i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);z-index:1;animation:blink 1.4s steps(2) infinite}
.welcome h2{margin:0 0 8px;font-family:var(--head);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:28px;line-height:1.15;color:var(--khaki);
  text-shadow:0 2px 0 rgba(0,0,0,.6)}
.welcome .tagline{display:inline-block;font:11.5px var(--mono);letter-spacing:.12em;color:#1a1d10;background:var(--amber);padding:3px 10px;margin-bottom:12px;text-transform:uppercase}
.welcome p{color:var(--dim);margin:0 auto 22px;max-width:430px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto}
.chip{text-align:left;padding:11px 12px;border-radius:2px;border:1px solid var(--line);border-left:4px solid var(--olive);background:var(--panel);font-size:13.5px;color:var(--txt);
  box-shadow:3px 3px 0 rgba(0,0,0,.35);transition:.15s}
.chip b{display:block;font:600 11px var(--mono);letter-spacing:.08em;color:var(--amber);margin-bottom:3px;text-transform:uppercase}
.chip:active{border-left-color:var(--amber);transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.35)}

/* composer */
footer{position:relative;z-index:2;padding:8px 10px calc(10px + var(--safe-b))}
.box{max-width:760px;margin:0 auto;background:rgba(22,27,17,.94);border:1px solid var(--line);border-radius:4px;padding:6px;transition:.2s;box-shadow:3px 3px 0 rgba(0,0,0,.45)}
.box:focus-within{border-color:var(--amber);box-shadow:var(--glow)}
.preview{display:none;padding:6px 6px 2px;position:relative}
.preview.show{display:block}
.preview img{height:64px;border-radius:2px;border:1px solid var(--line)}
.preview button{position:absolute;top:0;left:62px;width:22px;height:22px;border-radius:2px;background:var(--err);color:#fff;font-size:14px;line-height:1}
.row{display:flex;align-items:flex-end;gap:2px}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--txt);font:inherit;font-size:16px;padding:9px 6px;max-height:160px;min-height:40px}
textarea::placeholder{color:var(--faint);font-family:var(--mono);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.cbtn{width:40px;height:40px;border-radius:3px;display:grid;place-items:center;color:var(--khaki);flex:none}
.cbtn:active{color:var(--amber)}
.cbtn.rec{color:#fff;background:var(--err);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,107,74,.25)}}
.send{background:var(--amber);color:#1a1d10;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.send:disabled{opacity:.35;box-shadow:none}
.send.stop{background:var(--err);color:#fff}
.hint{text-align:center;font:10.5px var(--mono);letter-spacing:.04em;color:var(--faint);margin-top:6px;text-transform:uppercase}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,7,4,.65);z-index:9;opacity:0;pointer-events:none;transition:.25s}
.scrim.show{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);z-index:10;background:#161b12;border-right:2px solid var(--olive);
  transform:translateX(-102%);transition:.28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(14px + var(--safe-t)) 10px calc(12px + var(--safe-b))}
aside.show{transform:none}
.newbtn{display:flex;align-items:center;gap:8px;justify-content:center;padding:12px;border-radius:2px;font-family:var(--head);text-transform:uppercase;letter-spacing:.08em;font-weight:600;
  color:#1a1d10;background:var(--amber);margin-bottom:12px;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.list{flex:1;overflow-y:auto}
.item{display:flex;align-items:center;gap:6px;padding:10px;border-radius:2px;font-size:14px;color:var(--dim);border-left:3px solid transparent}
.item.active{background:rgba(91,100,54,.25);color:var(--txt);border-left-color:var(--amber)}
.item span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item button{color:var(--faint);padding:2px 6px}
.empty{color:var(--faint);text-align:center;font:12px var(--mono);margin-top:20px;text-transform:uppercase}
.sbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:2px;color:var(--khaki);border-top:1px solid var(--line);margin-top:6px;font-family:var(--head);text-transform:uppercase;letter-spacing:.06em}

/* modal */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(5,7,4,.65)}
.modal.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:#181d14;border:1px solid var(--line);border-top:3px solid var(--amber);
  border-radius:4px 4px 0 0;padding:18px 16px calc(18px + var(--safe-b));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--head);text-transform:uppercase;letter-spacing:.08em;font-size:21px;color:var(--khaki)}
label{display:block;font:11.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:14px 0 5px}
input[type=text],input[type=password],select,.sheet textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:2px;color:var(--txt);
  padding:11px 12px;font:inherit;font-size:16px;outline:0}
select option{background:var(--panel-solid)}
.sheet textarea{min-height:110px;resize:vertical}
input:focus,select:focus,.sheet textarea:focus{border-color:var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber)}
input[type=checkbox]{accent-color:var(--amber)}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px 8px;font-size:14px;border-radius:2px;font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border:1px solid var(--line);background:rgba(91,100,54,.25);box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.btn.pri{background:var(--amber);color:#1a1d10;border:0}
.status{font-size:13px;margin-top:10px;min-height:1.2em}
.note{font-size:12px;color:var(--faint);margin-top:6px}
.via{min-width:0;flex:1;text-align:right;font:10.5px var(--mono);text-transform:uppercase;color:var(--faint);margin-left:auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.provs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.provs::-webkit-scrollbar{display:none}
.pchip{flex:none;padding:8px 14px;border-radius:2px;border:1px solid var(--line);background:rgba(0,0,0,.3);font:600 13px var(--head);text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.pchip.on{border-color:var(--amber);color:#1a1d10;background:var(--amber)}
.mlist{max-height:46dvh;overflow-y:auto;margin-top:8px;border:1px solid var(--line);border-radius:2px}
.mitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px}
.mitem:last-child{border-bottom:0}
.mitem.on{background:rgba(242,179,61,.14);color:#fff;box-shadow:inset 3px 0 0 var(--amber)}
.mitem .mid{flex:1;min-width:0}
.mitem .mid div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mitem .mid small{display:block;color:var(--faint);font:11px var(--mono);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tag{font:10px var(--mono);padding:2px 6px;border-radius:2px;background:rgba(182,224,90,.16);color:var(--hud);flex:none}
.mempty{padding:18px;text-align:center;color:var(--faint);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;z-index:30;
  background:#1d2317;border:1px solid var(--amber);padding:8px 16px;border-radius:2px;font:12.5px var(--mono);text-transform:uppercase;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<header>
  <button class="hbtn" id="menuBtn" aria-label="Menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <button class="brand" id="brandBtn">HUY.AI<small><i class="dot" id="dot"></i><span id="stat">chưa kết nối</span> ▾</small></button>
  <button class="hbtn" id="newTop" aria-label="Chat mới"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
</header>

<main id="main"><div class="wrap" id="chat"></div></main>

<footer>
  <div class="box">
    <div class="preview" id="preview"><img id="pimg" alt=""><button id="pdel" aria-label="Bỏ ảnh">×</button></div>
    <div class="row">
      <button class="cbtn" id="imgBtn" aria-label="Gửi ảnh"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
      <textarea id="inp" rows="1" placeholder="Nhập lệnh, chỉ huy..."></textarea>
      <button class="cbtn" id="micBtn" aria-label="Nói"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg></button>
      <button class="cbtn send" id="sendBtn" aria-label="Gửi" disabled><svg class="ico" viewBox="0 0 24 24" id="sendIco"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div class="hint">Tin AI có thể sai · kiểm chứng lại</div>
  <input type="file" id="file" accept="image/*" hidden>
</footer>

<div class="scrim" id="scrim"></div>
<aside id="drawer">
  <button class="newbtn" id="newBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Cuộc trò chuyện mới</button>
  <div class="list" id="list"></div>
  <button class="sbtn" id="setBtn"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Cài đặt</button>
</aside>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>Cài đặt <button class="mini" id="closeSet">Đóng ✕</button></h3>

// ---------- nền rằn ri ----------
function paintCamo(g, W, H, scale){
  const cols = ["#4a5230", "#7a5f3a", "#2b3120", "#1b1f14", "#8c8259"];
  const freq = [16, 12, 12, 9, 4];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.fillStyle = "#5b6436"; g.fillRect(0, 0, W, H);
  const area = W * H / (420 * 420);
  cols.forEach((col, li) => {
    g.fillStyle = col;
    const n = Math.max(3, Math.round(freq[li] * area));
    for (let i = 0; i < n; i++){
      const cx = rnd() * W, cy = rnd() * H, R = (45 + rnd() * 70) * scale * (li === 4 ? .55 : 1);
      const pts = 9 + Math.floor(rnd() * 5), p = [];
      const stretch = .6 + rnd() * .8, rot = rnd() * Math.PI;
      for (let k = 0; k < pts; k++){
        const ang = k / pts * Math.PI * 2, r = R * (.55 + rnd() * .6);
        let x = Math.cos(ang) * r * (1 + stretch), y = Math.sin(ang) * r;
        p.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]);
      }
      g.beginPath();
      const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      let m0 = mid(p[pts - 1], p[0]); g.moveTo(m0[0], m0[1]);
      for (let k = 0; k < pts; k++){ const nx = p[(k + 1) % pts], m = mid(p[k], nx); g.quadraticCurveTo(p[k][0], p[k][1], m[0], m[1]); }
      g.closePath(); g.fill();
    }
  });
}
(function camo(){
  const cv = document.getElementById("sky"), g = cv.getContext("2d");
  function draw(){
    const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintCamo(g, W, H, 1);
    const n = g.createImageData(160, 160); for (let i = 0; i < n.data.length; i += 4){ const v = Math.random() * 255; n.data[i] = n.data[i+1] = n.data[i+2] = v; n.data[i+3] = 14; }
    const tc = document.createElement("canvas"); tc.width = tc.height = 160; tc.getContext("2d").putImageData(n, 0, 0);
    g.fillStyle = g.createPattern(tc, "repeat"); g.fillRect(0, 0, W, H);
  }
  let rt; draw(); addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 200); });
})();

// ---------- markdown mini ----------
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inline(s){
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length-1) + "\u0000"; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
       .replace(/~~([^~]+)~~/g, "<del>$1</del>")
       .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[i] + "</code>");
}
function md(src){
  const blocks = [];
  src = esc(src).replace(/```([\w+-]*)\n?([\s\S]*?)(```|$)/g, (_, lang, code) => {
    blocks.push(`<div class="pre"><div class="lang"><span>${lang || "code"}</span><button class="mini" data-copy>Copy</button></div><pre><code>${code.replace(/\n$/,"")}</code></pre></div>`);
    return "\n\u0001" + (blocks.length-1) + "\u0001\n";
  });
  const lines = src.split("\n"); let out = "", list = null, para = [];
  const flushP = () => { if (para.length){ out += "<p>" + inline(para.join("<br>")) + "</p>"; para = []; } };
  const flushL = () => { if (list){ out += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++){
    const l = lines[i]; let m;
    if (m = l.match(/^\u0001(\d+)\u0001$/)){ flushP(); flushL(); out += blocks[m[1]]; continue; }
    if (/^\s*$/.test(l)){ flushP(); flushL(); continue; }
    if (m = l.match(/^(#{1,6})\s+(.*)/)){ flushP(); flushL(); const n = Math.min(3, m[1].length); out += `<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)){ flushP(); flushL(); out += "<hr style='border:0;border-top:1px solid var(--line)'>"; continue; }
    if (m = l.match(/^&gt;\s?(.*)/)){ flushP(); flushL(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?[\s:-]+\|/.test(lines[i+1] || "")){
      flushP(); flushL();
      const row = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      let t = "<table><tr>" + row(l).map(c => `<th>${c}</th>`).join("") + "</tr>"; i++;
      while (i+1 < lines.length && /^\s*\|.*\|\s*$/.test(lines[i+1])){ i++; t += "<tr>" + row(lines[i]).map(c => `<td>${c}</td>`).join("") + "</tr>"; }
      out += t + "</table>"; continue;
    }
    if (m = l.match(/^\s*[-*+]\s+(.*)/)){ flushP(); if (list !== "ul"){ flushL(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; continue; }
    if (m = l.match(/^\s*\d+[.)]\s+(.*)/)){ flushP(); if (list !== "ol"){ flushL(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL();
  return out;
}

// ---------- data ----------
const cur = () => chats.find(c => c.id === curId);
const save = () => { store.set("hai_chats", chats); store.set("hai_cur", curId); };

function sysPrompt(){

// ---------- render ----------
const chatEl = $("#chat"), mainEl = $("#main"), inp = $("#inp"), sendBtn = $("#sendBtn");
const ICO = {
  copy: '<svg class="ico" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  redo: '<svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  speak:'<svg class="ico" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5ZM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>'
};
function msgEl(m, i, last){
  const d = document.createElement("div");
  d.className = "msg " + (m.role === "user" ? "user" : "bot");
  if (m.role === "user"){
    d.innerHTML = `<div class="bubble">${m.image ? `<img src="data:${m.image.mime};base64,${m.image.data}" alt="">` : ""}${esc(m.content)}</div>`;
  } else {
    d.innerHTML = `<div class="av">★</div><div style="min-width:0;flex:1"><div class="bubble${m.error ? " err" : ""}">${md(m.content)}</div>

      ${m.via ? `<span class="via">${esc(m.via)}</span>` : ""}</div></div>`;

}
function render(){
  const c = cur(); chatEl.innerHTML = "";
  if (!c || !c.msgs.length){
    chatEl.innerHTML = `<div class="welcome"><div class="orb"><i style="top:30%;left:62%"></i><i style="top:64%;left:28%;animation-delay:.5s"></i><i style="top:44%;left:76%;animation-delay:.9s"></i></div>

      <div class="chips">
        <button class="chip" data-q="Viết cho tao caption TikTok thật cháy cho video edit mới"><b>Nhiệm vụ 01</b>Caption TikTok cháy</button>
        <button class="chip" data-q="Lên kế hoạch tác chiến 7 ngày để tao học JavaScript từ số 0, chia theo từng ngày"><b>Nhiệm vụ 02</b>Kế hoạch học JS 7 ngày</button>
        <button class="chip" data-q="Phân tích giúp tao điểm mạnh, điểm yếu của một kênh TikTok edit video và cách tăng follow"><b>Nhiệm vụ 03</b>Trinh sát kênh TikTok</button>
        <button class="chip" data-q="Kể một chuyện cười lính tráng thật mất dạy nhưng không tục"><b>Nhiệm vụ 04</b>Chuyện cười lính</button>

    return;
  }
  const lastBot = c.msgs.length - 1;

function scrollDown(force){
  const near = mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight < 160;
  if (force || near) mainEl.scrollTop = mainEl.scrollHeight;
}
function renderList(){
  const L = $("#list");

  if (!has.length){ L.innerHTML = `<div class="empty">Chưa có cuộc chat nào</div>`; return; }
  L.innerHTML = has.sort((a,b) => b.t - a.t).map(c =>
    `<div class="item${c.id === curId ? " active" : ""}" data-id="${c.id}"><span>${esc(c.title || "Chat mới")}</span><button data-del="${c.id}" aria-label="Xoá">✕</button></div>`).join("");
}

// ---------- send ----------
async function send(text, regen){
  if (busy) return;
  if (!cfg.url){ openSet(); toast("Nhập link Worker trước đã mày"); return; }
  let c = cur();
  if (!regen){
    text = (text || "").trim();
    if (!text && !pendingImg) return;
    if (!c){ c = { id: Date.now().toString(36), title: "", msgs: [], t: Date.now() }; chats.push(c); curId = c.id; }
    const um = { role: "user", content: text || "Mày thấy gì trong ảnh này?" };
    if (pendingImg) um.image = pendingImg;
    c.msgs.push(um);
    if (!c.title) c.title = um.content.slice(0, 48);
    inp.value = ""; autoGrow(); clearImg();
  }
  c.t = Date.now(); save(); renderList();
  busy = true; setSendState(); render();

  const bot = { role: "assistant", content: "" };
  const holder = msgEl(bot, 0, false); const bub = holder.querySelector(".bubble");
  holder.querySelector(".acts").style.display = "none";
  bub.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  chatEl.appendChild(holder); scrollDown(true);

  ctrl = new AbortController();
  // chỉ gửi ảnh của 4 tin gần nhất cho nhẹ
  const payloadMsgs = c.msgs.filter(m => !m.error).map((m, i, a) => {
    const o = { role: m.role, content: m.content };
    if (m.image && i >= a.length - 4) o.image = m.image;
    return o;
  });
  try {
    const res = await fetch(cfg.url, {
      method: "POST", signal: ctrl.signal,
      headers: { "Content-Type": "application/json", ...(cfg.key ? { "X-Access-Key": cfg.key } : {}) },
      body: JSON.stringify({ messages: payloadMsgs, system: sysPrompt(), temperature: cfg.temp,
        provider: cfg.provider, model: cfg.provider === "auto" ? "" : (cfg.models[cfg.provider] || "") })
    });
    if (!res.ok){
      let e = res.status + ""; try{ e = (await res.json()).error || e; }catch{}
      throw new Error(e);
    }
    const usedP = res.headers.get("X-Provider") || "", usedM = res.headers.get("X-Model") || "";
    bot.via = pname(usedP) + (usedM ? " · " + shortModel(usedM) : "");
    setDot(true, labelNow());
    const reader = res.body.getReader(), dec = new TextDecoder();
    let raf = 0;
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      bot.content += dec.decode(value, { stream: true });
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; bub.innerHTML = md(bot.content); bub.classList.add("caret"); scrollDown(); });
    }
    if (!bot.content.trim()) bot.content = "_(AI im re không nói gì, thử hỏi lại xem)_";
  } catch (e){
    if (e.name === "AbortError"){ bot.content += bot.content ? "\n\n_(đã dừng)_" : "_(đã dừng)_"; }
    else {
      bot.error = true;
      let hint = "Kiểm tra lại link Worker / mật khẩu trong Cài đặt nha.";
      if (/location is not supported|not available in your country|unsupported_country|region/i.test(e.message)) hint = "AI này **chặn khu vực** của Worker. Bấm tên AI trên đầu để đổi sang AI khác (OpenRouter thường không bị chặn).";
      else if (/401|403|invalid.*key|api key|authentication/i.test(e.message)) hint = "Key của AI này sai hoặc hết hạn. Kiểm tra lại key trong Cloudflare.";
      else if (/429|quota|rate|credit|balance|billing/i.test(e.message)) hint = "Hết lượt/hết tiền với AI này. Chờ chút hoặc đổi sang AI khác.";
      else if (/404|not.?found|does not exist|model/i.test(e.message)) hint = "Model này không tồn tại hoặc mày không có quyền. Bấm tên AI trên đầu để chọn model khác.";
      bot.content = "**Lỗi rồi:** " + e.message + "\n\n" + hint;
      setDot(false, "lỗi · " + labelNow());
    }
  }
  c.msgs.push(bot); c.t = Date.now(); save();
  busy = false; ctrl = null; setSendState(); render();
  if (cfg.tts && !bot.error) speak(bot.content);
}
function setSendState(){
  sendBtn.classList.toggle("stop", busy);
  $("#sendIco").innerHTML = busy ? '<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>' : '<path d="M5 12h14M13 6l6 6-6 6"/>';
  sendBtn.disabled = !busy && !inp.value.trim() && !pendingImg;
}

// ---------- image ----------
$("#imgBtn").onclick = () => $("#file").click();
$("#file").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const img = new Image(), rd = new FileReader();
  rd.onload = () => { img.src = rd.result; };
  img.onload = () => {
    const max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement("canvas"); cv.width = img.width * s; cv.height = img.height * s;
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const url = cv.toDataURL("image/jpeg", .82);
    pendingImg = { mime: "image/jpeg", data: url.split(",")[1] };
    $("#pimg").src = url; $("#preview").classList.add("show"); setSendState();
  };
  rd.readAsDataURL(f);
};
function clearImg(){ pendingImg = null; $("#preview").classList.remove("show"); setSendState(); }
$("#pdel").onclick = clearImg;

// ---------- voice ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$("#micBtn").onclick = () => {
  if (!SR){ toast("Trình duyệt này không hỗ trợ nói, xài Chrome đi"); return; }
  if (rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = "vi-VN"; rec.interimResults = true; rec.continuous = false;
  const base = inp.value ? inp.value + " " : "";
  rec.onresult = e => { inp.value = base + Array.from(e.results).map(r => r[0].transcript).join(""); autoGrow(); setSendState(); };
  rec.onend = () => { $("#micBtn").classList.remove("rec"); rec = null; if (inp.value.trim()) send(inp.value); };
  rec.onerror = e => { if (e.error !== "no-speech" && e.error !== "aborted") toast("Mic lỗi: " + e.error); };
  $("#micBtn").classList.add("rec"); rec.start();
};
function speak(text){
  if (!("speechSynthesis" in window)) return toast("Máy không hỗ trợ đọc");
  speechSynthesis.cancel();
  const clean = text.replace(/```[\s\S]*?```/g, " đoạn code ").replace(/[*_#`>|]/g, "").slice(0, 3000);
  const u = new SpeechSynthesisUtterance(clean); u.lang = "vi-VN";
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("vi")); if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// ---------- events ----------
function autoGrow(){ inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 160) + "px"; }
inp.addEventListener("input", () => { autoGrow(); setSendState(); });
inp.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer:fine)").matches){ e.preventDefault(); send(inp.value); }
});
sendBtn.onclick = () => busy ? ctrl && ctrl.abort() : send(inp.value);

chatEl.addEventListener("click", e => {
  const chip = e.target.closest("[data-q]"); if (chip) return send(chip.dataset.q);
  const cp = e.target.closest("[data-copy]");
  if (cp){ copy(cp.closest(".pre").querySelector("code").innerText); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const c = cur(); if (!c) return;
  if (a.dataset.act === "copy") copy(c.msgs[a.dataset.i].content);
  if (a.dataset.act === "speak") speak(c.msgs[a.dataset.i].content);
  if (a.dataset.act === "redo"){ c.msgs.pop(); save(); send("", true); }
});
function copy(t){
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Copy rồi đó"))
    .catch(() => { const x = document.createElement("textarea"); x.value = t; document.body.appendChild(x); x.select(); document.execCommand("copy"); x.remove(); toast("Copy rồi đó"); });
}

// drawer
const openDrawer = () => { renderList(); $("#drawer").classList.add("show"); $("#scrim").classList.add("show"); };
const closeDrawer = () => { $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); };
$("#menuBtn").onclick = openDrawer; $("#scrim").onclick = closeDrawer;
$("#newBtn").onclick = newChat; $("#newTop").onclick = newChat;
$("#list").onclick = e => {
  const del = e.target.closest("[data-del]");
  if (del){ if (!confirm("Xoá cuộc chat này?")) return; chats = chats.filter(c => c.id !== del.dataset.del); if (curId === del.dataset.del) curId = null; save(); renderList(); render(); return; }
  const it = e.target.closest("[data-id]"); if (it && !busy){ curId = it.dataset.id; save(); render(); closeDrawer(); }
};

// settings
function openSet(){
  $("#sUrl").value = cfg.url; $("#sKey").value = cfg.key; $("#sPersona").value = cfg.persona; $("#sCustom").value = cfg.custom;
  $("#sTemp").value = cfg.temp; $("#tVal").textContent = cfg.temp; $("#sTts").checked = cfg.tts;
  $("#customWrap").style.display = cfg.persona === "custom" ? "block" : "none"; $("#sStat").textContent = "";
  closeDrawer(); $("#modal").classList.add("show");
}
const closeSet = () => $("#modal").classList.remove("show");
$("#setBtn").onclick = openSet; $("#closeSet").onclick = closeSet;
$("#modal").onclick = e => { if (e.target.id === "modal") closeSet(); };
$("#sPersona").onchange = e => $("#customWrap").style.display = e.target.value === "custom" ? "block" : "none";
$("#sTemp").oninput = e => $("#tVal").textContent = e.target.value;
function readSet(){
  return { url: $("#sUrl").value.trim().replace(/\/+$/, ""), key: $("#sKey").value, persona: $("#sPersona").value,
    custom: $("#sCustom").value, temp: +$("#sTemp").value, tts: $("#sTts").checked };
}
$("#saveBtn").onclick = () => { cfg = Object.assign(cfg, readSet()); saveCfg(); closeSet(); toast("Lưu rồi"); ping(); };
$("#testBtn").onclick = async () => {
  const s = readSet(), st = $("#sStat");
  if (!s.url){ st.innerHTML = "<span style='color:var(--err)'>Chưa nhập link Worker</span>"; return; }
  st.textContent = "Đang test...";
  try {
    const r = await fetch(s.url); const j = await r.json();
    if (!j.ok) throw new Error("Link này không phải Worker HUY.AI");
    const list = j.providers || [j.gemini && { name: "Gemini" }, j.workersAI && { name: "Workers AI" }].filter(Boolean);
    const p = list.map(x => x.name + " ✓").join(" · ") || "chưa có AI nào (thiếu key)";
    const old = j.version >= 2 ? "" : "<br><span style='color:var(--err)'>Worker đang là bản cũ, dán lại worker.js mới để đổi được nhiều AI.</span>";
    st.innerHTML = `<span style="color:var(--ok)">Kết nối ngon!</span> ${esc(p)}${j.locked ? " · có mật khẩu" : ""}${old}`;
  } catch (e){ st.innerHTML = `<span style="color:var(--err)">Toang: ${esc(e.message)}</span>`; }
};

// ---------- chọn AI / model ----------
function labelNow(){
  if (cfg.provider === "auto") return "Tự động";
  return pname(cfg.provider) + (cfg.models[cfg.provider] ? " · " + shortModel(cfg.models[cfg.provider]) : "");
}
function saveCfg(){ store.set("hai_cfg", cfg); }
function openPicker(){
  if (!cfg.url){ openSet(); return; }
  renderProvs(); $("#mSearch").value = ""; $("#picker").classList.add("show");
  if (!provList.length) ping().then(renderProvs);
  loadModels(false);
}
const closePicker = () => $("#picker").classList.remove("show");
$("#brandBtn").onclick = openPicker; $("#closePick").onclick = closePicker;
$("#picker").onclick = e => { if (e.target.id === "picker") closePicker(); };
function renderProvs(){
  const ids = ["auto", ...provList.map(p => p.id)];
  if (cfg.provider !== "auto" && !ids.includes(cfg.provider) && provList.length) cfg.provider = "auto";
  $("#provs").innerHTML = ids.map(id => `<button class="pchip${cfg.provider === id ? " on" : ""}" data-p="${id}">${esc(id === "auto" ? "⚡ Tự động" : pname(id))}</button>`).join("");
  $("#modelBox").style.display = cfg.provider === "auto" ? "none" : "block";
  $("#pickNote").innerHTML = cfg.provider === "auto"
    ? "Tự động: thử lần lượt các AI có key, cái nào chạy được thì dùng."
    : (provList.length ? "" : "Đang lấy danh sách AI từ Worker...");
  if (!provList.length && cfg.url) $("#pickNote").textContent = "Worker chưa có key AI nào, hoặc đang là bản cũ.";
}
$("#provs").onclick = e => {
  const b = e.target.closest("[data-p]"); if (!b) return;
  cfg.provider = b.dataset.p; saveCfg(); renderProvs(); setDot(true, labelNow());
  $("#mSearch").value = ""; loadModels(false);
};
const PREFER = {
  anthropic: [/sonnet/], openai: [/^gpt-[\d.]+-mini$/, /^gpt-[\d.]+o?$/, /^gpt/], gemini: [/^gemini-flash-latest$/, /flash/],
  groq: [/llama-3\.3-70b/, /llama/], openrouter: [/^openrouter\/auto$/], deepseek: [/deepseek-chat/], xai: [/grok/], workersai: [/llama-3\.3/]
};
function pickDefault(p, list){
  for (const re of PREFER[p] || []){ const m = list.find(x => re.test(x.id)); if (m) return m.id; }
  return list[0] && list[0].id;
}
async function loadModels(force){
  const p = cfg.provider; if (p === "auto") return;
  const L = $("#mlist");
  if (!force && modelCache[p] && Date.now() - modelCache[p].t < 864e5){ showModels(); return; }
  L.innerHTML = `<div class="mempty">Đang tải danh sách model...</div>`;
  try {
    const r = await fetch(cfg.url + "/models?provider=" + encodeURIComponent(p), { headers: cfg.key ? { "X-Access-Key": cfg.key } : {} });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
    modelCache[p] = { t: Date.now(), list: j.models || [] }; store.set("hai_models", modelCache);
    if (!cfg.models[p]){ cfg.models[p] = pickDefault(p, modelCache[p].list) || ""; saveCfg(); setDot(true, labelNow()); }
    if (cfg.provider === p) showModels();
  } catch (e){ if (cfg.provider === p) L.innerHTML = `<div class="mempty">Không tải được: ${esc(e.message)}<br>Vẫn gõ tên model rồi bấm "Dùng" được.</div>`; }
}
function showModels(){
  const p = cfg.provider, q = $("#mSearch").value.trim().toLowerCase();
  let list = (modelCache[p] && modelCache[p].list) || [];
  if (q) list = list.filter(m => (m.id + " " + m.name).toLowerCase().includes(q));
  const cur = cfg.models[p];
  if (cur) list = [...list.filter(m => m.id === cur), ...list.filter(m => m.id !== cur)];
  $("#mlist").innerHTML = list.length ? list.slice(0, 300).map(m =>
    `<button class="mitem${m.id === cur ? " on" : ""}" data-m="${esc(m.id)}"><div class="mid"><div>${esc(m.name)}</div>${m.name !== m.id ? `<small>${esc(m.id)}</small>` : ""}</div>${m.free ? '<span class="tag">FREE</span>' : ""}${m.id === cur ? "✓" : ""}</button>`).join("")
    : `<div class="mempty">Không có model nào khớp</div>`;
}
$("#mSearch").oninput = showModels;
$("#mReload").onclick = () => loadModels(true);
$("#mUse").onclick = () => {
  const v = $("#mSearch").value.trim(); if (!v) return toast("Gõ tên model vào ô trên đã");
  cfg.models[cfg.provider] = v; saveCfg(); setDot(true, labelNow()); closePicker(); toast("Dùng " + v);
};
$("#mlist").onclick = e => {
  const b = e.target.closest("[data-m]"); if (!b) return;
  cfg.models[cfg.provider] = b.dataset.m; saveCfg(); setDot(true, labelNow()); closePicker(); toast("Đổi sang " + shortModel(b.dataset.m));
};
$("#wipeBtn").onclick = () => { if (!confirm("Xoá SẠCH lịch sử chat?")) return; chats = []; curId = null; save(); render(); renderList(); closeSet(); toast("Sạch bóng"); };

function setDot(on, txt){ $("#dot").className = "dot " + (on ? "on" : "off"); $("#stat").textContent = txt; }
async function ping(){
  if (!cfg.url){ setDot(false, "chưa có link Worker"); return; }
  try {
    const j = await (await fetch(cfg.url)).json();
    provList = j.providers || [j.gemini && { id: "gemini", name: "Gemini" }, j.workersAI && { id: "workersai", name: "Workers AI" }].filter(Boolean);
    if (cfg.provider !== "auto" && !provList.find(p => p.id === cfg.provider)) { cfg.provider = "auto"; saveCfg(); }
    setDot(provList.length > 0, provList.length ? labelNow() : "Worker chưa có key AI");
  }
  catch { setDot(false, "không kết nối được"); }
}
let tt; function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1800); }

render(); renderList(); setSendState(); ping();
if (!cfg.url) setTimeout(openSet, 400);
</script>
</body>
</html>
